<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- A document rather than a control surface, like the catalog. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My tunes · Tune Up</title>
    <link rel="icon" href="/tune-up-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="level-page patterned is-mine">
    <nav class="site-nav">
      <a class="site-logo" href="/">
        <img class="site-logo-mark" src="/tune-up-icon.svg" alt="" width="450" height="450" />
        <span class="site-logo-name">Tune Up</span>
      </a>
      <div id="site-nav" class="site-links">
        <!-- Filled in by site-nav.ts: the same places from every page, the
             one you are on marked, and the corner that knows who you are. -->
      </div>
    </nav>

    <main class="page">
      <div class="page-head">
        <h1 class="page-title">My Tunes</h1>

        <!-- The one invitation on this page, and the only way to the editor
             now that the nav has stopped offering a second one. A link rather
             than a button: it goes to an address, and should open in a new tab
             like any other. -->
        <a class="page-action" href="/edit"
          ><!-- Phosphor Icons' `plus`, regular, MIT — the same family and the
               same notice as the shapes in `icons.ts`. Spelled out here
               because this button is markup rather than something a module
               builds. Centred on the words by the flex row it sits in. -->
          <svg
            class="page-action-plus"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 256 256"
            fill="currentColor"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"
            />
          </svg>
          Create Tune</a
        >

        <!-- Filled in by main.ts, like the catalog's. -->
        <div id="levels-controls" class="level-controls"></div>
      </div>

      <ul id="levels" class="level-list"></ul>
      <p id="levels-note" class="page-note" role="status">Loading…</p>
    </main>

    <footer class="site-foot"><a href="/about">About</a> · <a href="/privacy">Privacy</a></footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
