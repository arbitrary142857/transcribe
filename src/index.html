<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- A document rather than a control surface, so unlike the editor this one
         lets the page be zoomed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transcribe</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <nav class="site-nav">
      <a class="site-name" href="/" aria-current="page">Transcribe</a>
      <div class="site-links">
        <a href="/edit">New transcription</a>
        <!-- Filled in by session-nav.ts once /api/me has answered. Empty in
             the markup so nothing flashes one state and settles as another. -->
        <span id="session-nav" class="session-slot"></span>
      </div>
    </nav>

    <main class="page">
      <h1 class="page-title">Levels</h1>
      <p class="page-lede">
        Melodies people have picked off a recording and written down.
      </p>

      <!-- Filled in by home.ts. Empty in the markup rather than a checkbox
           swapped out later, so it never flashes as one shape and settles as
           another. -->
      <div id="levels-controls" class="level-controls"></div>

      <ul id="levels" class="level-list"></ul>
      <p id="levels-note" class="page-note" role="status">Loading…</p>
    </main>

    <script type="module" src="./home.ts"></script>
  </body>
</html>
