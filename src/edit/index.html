<!doctype html>
<html lang="en">
  <head>
    <!-- IMPORTANT: Set the character set to UTF-8. Otherwise you may get weird symbols on the score. -->
    <meta charset="utf-8" />
    <!-- The page is a set of controls, not a document: a double tap is a second
         click on a button, and a drag past the edge is not a request to reload. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Melody Editor · Transcribe</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <!-- Above the toolbar rather than inside it, for two reasons: the toolbar
         is hidden until a melody exists, which is exactly the stretch of time
         when leaving is easiest to want; and both bars below are sticky rather
         than fixed, so this scrolls away the moment work starts and gives the
         top back to the controls. -->
    <nav class="site-nav">
      <a class="site-name" href="/">Transcribe</a>
      <div id="site-nav" class="site-links">
        <!-- Filled in by site-nav.ts: the same places from every page, the
             one you are on marked, and the corner that knows who you are. -->
      </div>
    </nav>

    <!-- A band across the whole window with its contents centred inside, so the
         controls never end in a hard edge partway across the page. Pinned to the
         top as the keyboard is pinned to the bottom, and above the music so it
         cannot slide out from under the pointer as the score grows a line. -->
    <div id="toolbar" hidden>
      <div id="toolbar-inner">
        <div id="signatures"></div>
        <div id="toolbar-body">
          <div id="controls">
            <div id="durations"></div>
            <div id="tuplets"></div>
            <div id="actions"></div>
          </div>
        </div>
        <p id="status" role="status"></p>
      </div>
    </div>

    <main class="editor-main">
      <!-- Shown only until a clef and a meter are chosen. From then on both are
           read off the stave, and this is emptied for good. -->
      <div id="setup"></div>

      <!-- The working frame: the video's column at the left, and beside it the
           score over the keyboard. Once a melody exists the page stops
           scrolling and the score's own box is the only thing that does. -->
      <div id="main-body">
        <!-- Everything to do with the video: the controls that drive the
             player, and the player under them. Filled in once the link has
             been given and rebuilt only by the mode switch, which puts the
             position back itself — nothing an edit does sends the player back
             to the start. -->
        <aside id="side-panel" hidden>
          <div id="playback">
            <div id="playback-controls"></div>
            <div id="video"></div>
          </div>
        </aside>

        <div id="work-column">
          <div id="score-scroll">
            <div id="workspace" hidden>
              <!-- The score has every one of its children replaced on each
                   redraw, so the marker that follows the video is a neighbour
                   of it rather than a child, and this is what holds the two
                   together. -->
              <div id="score-area">
                <div id="score"></div>
              </div>
            </div>
          </div>

          <div id="keyboard-area" hidden>
            <div id="keyboard"></div>
            <div id="pitch-actions"></div>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
