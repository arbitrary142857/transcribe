<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- A document rather than a control surface, so unlike the editor this one
         lets the page be zoomed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tunes · Tune Up</title>
    <link rel="icon" href="/tune-up-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="level-page patterned is-public">
    <nav class="site-nav">
      <a class="site-logo" href="/">
        <img class="site-logo-mark" src="/tune-up-icon.svg" alt="" width="450" height="450" />
        <span class="site-logo-name">Tune Up</span>
      </a>
      <div id="site-nav" class="site-links">
        <!-- Filled in by site-nav.ts: the same places from every page, the
             one you are on marked, and the corner that knows who you are. -->
      </div>
    </nav>

    <main class="page">
      <div class="page-head">
        <h1 class="page-title">Public Tunes</h1>
        <p class="page-head-lede">Pick a tune to transcribe!</p>

        <!-- Filled in by main.ts, once /api/me has said who is looking: two of
             the cuts behind the funnel are about the viewer's own doings and
             are not offered to nobody. Empty in the markup rather than a
             control swapped out later, so it never flashes as one shape and
             settles as another. -->
        <div id="levels-controls" class="level-controls"></div>
      </div>

      <ul id="levels" class="level-list"></ul>
      <p id="levels-note" class="page-note" role="status">Loading…</p>
    </main>

    <footer class="site-foot"><a href="/about">About</a> · <a href="/privacy">Privacy</a></footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
